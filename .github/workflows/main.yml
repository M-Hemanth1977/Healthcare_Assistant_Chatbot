name: Sync to Hugging Face hub
on:
  push:
    branches: [main]

  # run manually from the Actions tab
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Pull latest from Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git pull --rebase https://Aswadham:${HF_TOKEN}@huggingface.co/spaces/Aswadham/Healthcare_Assistant_Chatbot main

      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git push https://Aswadham:${HF_TOKEN}@huggingface.co/spaces/Aswadham/Healthcare_Assistant_Chatbot main

